[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "rchp"
version = "0.2.1"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "enstarep", email = "enstarep@rncyk.org"}]
requires-python = ">=3.10"

dependencies = []

[tool.scikit-build]
minimum-version = "0.10.0"
build-dir = "_skbuild"

[tool.scikit-build.wheel]
exclude = ["*.cc", "*.cpp", "*.cxx", "*.h", "*.hpp", "include/**/*"]
packages = ["rchp"]

cmake.args = []


