name: rwheels

on:
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install vcpkg and dependencies
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg/vcpkg install cpr:x64-windows
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
        elif [ "$RUNNER_OS" == "Linux" ]; then
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install cpr
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV
        else
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install cpr
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV
        fi

        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
        else
          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Build wheel
      run: |
        pip install build wheel scikit-build-core pybind11
        cd rchp
        CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=${{ env.CMAKE_TOOLCHAIN_FILE }}" python -m build --wheel --outdir ../dist
      
    - name: Save wheels
      uses: actions/upload-artifact@v4
      with:
        name: python-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl
        retention-days: 7
