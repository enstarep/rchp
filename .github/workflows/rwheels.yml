name: rwheels

on:
  workflow_dispatch:

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13","3.14"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install cpr:x64-windows
        elif [ "$RUNNER_OS" == "Linux" ]; then
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install cpr:x64-linux
        elif [ "$RUNNER_OS" == "macOS" ]; then
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install cpr:x64-osx
        fi
        
    - name: Build wheel
      env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        CMAKE_ARGS: "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      run: |
        pip install build wheel scikit-build-core pybind11
        cd rchp && python -m build --wheel --outdir ../dist

    - name: Save wheels
      uses: actions/upload-artifact@v4
      with:
        name: python-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/*.whl
        retention-days: 7
